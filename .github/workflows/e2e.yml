# SPDX-License-Identifier: Apache-2.0
#
# Playwright end-to-end tests: the demo dApp and the Playwright example,
# against the QoreX wallet mock in both profiles. The REST endpoint is stubbed;
# the live testnet test is skipped here (QORE_LIVE_TEST is not set).
#
# Note: @qorechain/qorex-wallet-mock depends on @qorechain/qoresign, which CI
# installs from npm. Publish @qorechain/qoresign 0.1.0 before this
# repository's first CI run.

name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "./packages/*" build

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @qorechain/qorex-demo exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qorechain/qorex-demo exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qorechain/qorex-demo exec playwright install-deps chromium

      - name: Demo dApp
        run: pnpm --filter @qorechain/qorex-demo test:e2e
        env:
          CI: "true"

      - name: Playwright example
        run: pnpm --filter @qorechain/qorex-example-playwright-e2e test:e2e
        env:
          CI: "true"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/demo/playwright-report
            apps/demo/test-results
          retention-days: 7
